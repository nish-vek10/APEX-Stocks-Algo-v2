# apex_desk/conf/desk.yaml
# Single source of truth for the APEX Desk (human-in-the-loop signal desk).
# Independent from config/production.yaml: NOTHING here changes the old scheduler.

desk:
  name: "APEX DESK"
  display_tz: "Europe/London"          # clocks/countdown are shown in this zone
  review_by: ["ANISH", "JOSH"]       # names offered in the dashboard 'decided by' selector

mode: dry_run                          # dry_run = simulate orders (no MT5 order_send) | live = send real orders to the MT5 account in .env

strategy:                              # validated in research/dislocation_study (steps 08-11)
  tiers:                               # TRADABLE tiers are reviewed by you + manager; risk_mult scales the 1% risk
    A:
      label: "Core breakout"
      setup: breakout                  # Stage 6/7 Donchian breakout with Stage-2 history
      min_dist_below_ema200: 0.25
      max_days_since_stage2: 40
      risk_mult: 1.0
      tradable: true
      backtest: "+0.20R/trade, 36% win, ~1.3 signals/day"
    B:
      label: "Extended breakout"
      setup: breakout
      min_dist_below_ema200: 0.15      # more lenient distance
      max_days_since_stage2: 60
      risk_mult: 0.5
      tradable: true
      backtest: "+0.06R/trade, 38% win, ~2 signals/day (marginal: use judgement)"
    W:
      label: "Warming up"
      setup: warming                   # pre-breakout setups: near breakout / EMA20 reclaim / EMA50 reclaim
      min_dist_below_ema200: 0.25
      max_days_since_stage2: 60
      min_avg_dollar_vol: 500000       # liquidity floor for warming setups (not backtested; sanity filter)
      risk_mult: 0.5
      tradable: true
      backtest: "+0.16R to +0.23R/trade, ~35% win, ~13 setups/day in total"
  setup_info:
    BRK: {label: "Breakout", backtest: "Stage 6/7 Donchian breakout"}
    W1:  {label: "Near breakout", backtest: ">=25% below, within 3% of the 20d high, EMA10>EMA20: +0.16R, ~2/day"}
    W2:  {label: "EMA20 reclaim", backtest: ">=25% below: closes back above EMA20: +0.23R, ~8.6/day (positive in all 3 periods)"}
    W3:  {label: "EMA50 reclaim", backtest: ">=25% below: closes back above EMA50: +0.20R, ~2.3/day"}
  manual_risk_mult: 0.5                # default risk multiple for starred info-only (tier C) setups
  show_tier_c: true                    # every other breakout, greyed, info only
  min_price: 2.0                       # penny-stock floor (SSII lesson)
  atr_period: 14
  atr_multiplier: 3.5                  # LOCKED 3.5x: best in the 2x-3.5x band (study: +51% CAGR, -63% maxDD at >=25% below EMA200, Stage 2 <=40, 3 per ticker)
  stop_floor_pct: 0.005
  time_stop_days: 365

watchlist:
  max_age_days: 45                    # unexecuted A/B/W setups roll to each new session (Watchlist tab) for this long

risk:
  risk_pct: 0.01                       # 1% of equity risked per trade
  max_risk_pct_override: 0.02          # per-trade manual risk override cap (2% of equity)
  max_positions: 75                    # total open positions for this desk
  max_per_ticker: 3                    # up to 3 concurrent trades in the same ticker
  max_position_value_pct: 0.20         # notional <= 20% of equity per position
  max_gross_x: 5.0                     # total notional / equity cap (set null to disable)
  max_shares: 100000
  default_equity: 100000.0             # used for previews until the executor reports real MT5 equity

timing:                                # all keyed to New York time, so UK/US DST mismatch weeks are handled
  cutoff_minutes_before_open: 60       # 60 min before 09:30 ET = 13:30 London (12:30 in the 1-2 week DST mismatch)
  scan_time_et: "17:20"                # after the old scheduler's cache refresh (16:45) and signals (17:05)
  exec_time_et: "09:31"                # entries + exits at the open, same as the old scheduler
  snapshot_every_min: 30
  no_quote_retry_window_sec: 300
  no_quote_retry_interval_sec: 30

execution:
  magic_number: 20261001               # DIFFERENT from the old scheduler's magic -> never touches its positions
  comment_prefix: "DESK"

data:
  cache_dir: null                      # null = auto-detect: prod cache dir if present, else data/raw/work_pc_cache/.../parquets
  scan_workers: 4

paths:
  db: "state/desk.db"
  log_dir: "logs"

# Cloud relay to Supabase (Netlify dashboard). Secrets live in .env, never here.
sync:
  enabled: false      # set true after Supabase setup
  interval_sec: 60
