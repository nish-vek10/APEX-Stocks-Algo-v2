# config/ig_epic_map.yaml
# -- IG Epic Mapping -------------------------------------------------------
# Full universe: 82 US equity 24h cash CFDs on IG demo CFD account (Z5S2OK)
# Validated: 2026-06-01 via export_full_universe.py + ig_epic_inspector.py
#
# Format: {PREFIX}.D.{IG_TICKER}.CASH.IP  (undated 24h cash CFD)
# KEY = yfinance ticker (used for data fetch + stage classification)
# VALUE = IG epic (used for live price + order execution)
# NOTE: IG uses old/internal tickers in epics -- see inline comments.
# -------------------------------------------------------------------------

