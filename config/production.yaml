  timeframe: "D1"             # Timeframe identifier (D1 = daily)
  lookback_days: 300          # Bars fetched per symbol per run (300 trading days ~ 15 months)

# ─── Spider Gate ───────────────────────────────────────────────────────────────
spider_gate:
  enabled: false               # Disabled -- spider_gate_daily.parquet not built yet. Re-enable once it exists.
  file: "data/cleaned/spiders_daily/gate/spider_gate_daily.parquet"

# ─── Entry / Exit ──────────────────────────────────────────────────────────────
entry:
  require_stage2_history: true
  stage_target: 7             # Stage that triggers signal (Stage 7 = Breakout Confirmed)

exit:
  time_stop_days: 365         # Backtest: config/backtest.yaml time_stop_days: 365
  gap_protection: true        # Exit at open if open gaps below stop
  stage9_exit: true           # Exit next open when Stage 9 detected

stop:
  mode: "atr"                 # "atr" | "fixed_pct"
  atr_multiplier: 2.0         # Backtest default: ATR(14) x 2.0
  atr_period: 14              # Wilder's 14-period ATR
  floor_pct: 0.005            # Min stop distance = 0.5% of entry

# ─── Execution / Risk-Sizing Tolerance ─────────────────────────────────────────
# MT5 lot granularity (volume_step/contract_size) means realized risk per
# trade can never land exactly on the 1% target -- this defines how much
# drift is tolerated before a trade is skipped outright rather than sent
# with badly-mismatched risk. Found 2026-08-27: several symbols (GO.NAS,
# OCUL.NAS, VFF.NAS-24) rounded 40-85% away from target and were still
# being executed with only a log WARNING. Now anything over
# risk_deviation_max_pct is skipped + alerted like any other rejected order.
execution:
  risk_deviation_warn_pct: 0.15   # log a warning above this drift
  risk_deviation_max_pct: 0.30    # skip the trade entirely above this drift

portfolio:
  max_open_positions: 100
  max_sector_concentration: 0.35
  max_single_position_pct: 0.20

circuit_breakers:
  daily_drawdown_halt_pct: 0.03
  weekly_drawdown_halt_pct: 0.07
  consecutive_loss_halt: 5
  enabled: true

# Documentation only -- scheduler.py owns the actual cron trigger and reads
# APEX_SIGNAL_HOUR/MIN, APEX_EXEC_HOUR/MIN env vars (defaults below) against
# an America/New_York (NYSE local) BlockingScheduler, NOT UTC. This means
# these clock times auto-adjust across DST -- no manual UTC math, no risk of
# drifting relative to NYSE open/close when US or UK daylight saving shifts.
scheduling:
  signal_time_et: "17:05"     # after 16:00 ET close
  execution_time_et: "09:31"  # after 09:30 ET open
  timezone: "America/New_York"
