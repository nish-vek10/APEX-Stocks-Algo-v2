# config/production.yaml
# ─── APEX Production Configuration ─────────────────────────────────────────────

environment: "paper"          # "paper" | "live"  — MUST be changed to "live" for real execution

# ─── Broker Selection ──────────────────────────────────────────────────────────
broker: "mt5"                 # "ig" | "mt5"  — selects execution backend

# ─── IG Group API Credentials ─────────────────────────────────────────────────
# Set via .env file (see .env.example) — never hardcode here
ig:
  identifier: ""              # Set via IG_IDENTIFIER env var
  password: ""                # Set via IG_PASSWORD env var
  api_key: ""                 # Set via IG_API_KEY env var
  acc_number: ""              # Set via IG_ACCOUNT_ID env var
  acc_type: "DEMO"            # "DEMO" | "LIVE" — switch to "LIVE" for real execution

# ─── MT5 Credentials (legacy — kept for reference, unused in ig mode) ──────────
mt5:
  server: ""                  # Set via MT5_SERVER env var or here
  login: 0                    # Set via MT5_LOGIN env var
  password: ""                # Set via MT5_PASSWORD env var
  timeout_ms: 10000
  magic_number: 20240001

